name: autoforge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core utilities
  - pydantic>=2.5
  - python-dotenv>=1.0
  - sqlalchemy>=2.0
  - loguru>=0.7
  - rich>=13.0
  - typer>=0.12

  # Data + light ML
  - pandas
  - numpy
  - scikit-learn
  - psutil>=5.9   # Profiler hardware probe (CPU + memory)

  # Test
  - pytest>=8.0
  - pytest-asyncio>=0.23

  # Pip-only packages
  - pip:
      # LLM client (Nemotron via NIM is OpenAI-API-compatible)
      - openai>=1.50

      # HITL surfaces
      - streamlit>=1.30
      - streamlit-autorefresh>=1.0
      - streamlit-agraph>=0.0.45
      - streamlit-extras>=0.4
      - python-telegram-bot>=20.7
      - plotly>=5.18

      # Strategy Agent tools
      - tavily-python>=0.5
      - arxiv>=2.1

      # Optional ML libs — only imported via try/except in tools/training_tools.py:select_classifier_class.
      # Trainer is sklearn-only by default; these unlock alternate codepaths if installed.
      - xgboost>=2.0
      - optuna>=3.5

      # NemoClaw — uncomment when wiring the subprocess sandbox (planned).
      # - nemoclaw
